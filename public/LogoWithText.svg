<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <defs>
    <linearGradient id="logoWithText_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="logoWithText_purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="logoWithText_teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- ===================================================== -->
  <!-- Logo Mark (Concept 4: Interlocking OH Loop) -->
  <!-- ===================================================== -->
  <g id="logo-mark" transform="translate(10, 0)">
    <!-- Left Ring: Advisor Loop ('O') -->
    <circle cx="46" cy="60" r="28" stroke="url(#logoWithText_blue)" stroke-width="8" stroke-linecap="round"/>

    <!-- Right Ring: Student / Clock Loop ('H') -->
    <circle cx="74" cy="60" r="28" stroke="url(#logoWithText_purple)" stroke-width="8" stroke-linecap="round"/>

    <!-- Intersecting Overlap / Synced Meeting Bridge -->
    <path d="M60 40 C65 46, 65 74, 60 80" stroke="url(#logoWithText_teal)" stroke-width="8" stroke-linecap="round"/>

    <!-- Synchronized Active Node -->
    <circle cx="60" cy="60" r="6" fill="#10b981"/>
    <circle cx="60" cy="60" r="10" stroke="#10b981" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- ===================================================== -->
  <!-- Brand Name Typography -->
  <!-- ===================================================== -->
  <g id="logo-text">
    <text
      x="135"
      y="71"
      font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
      font-size="44"
      font-weight="700"
      letter-spacing="-1.2"
      fill="#0f172a">
      Office<tspan font-weight="400" fill="#6d28d9">Hours</tspan>
    </text>
  </g>
</svg>